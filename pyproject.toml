[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "group-chat-ledger"
version = "0.1.0"
description = "Extract expenses, commitments and events from WhatsApp chat exports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "google-genai>=2.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gcl = "gcl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real Gemini API (run with: pytest -m live)"]
addopts = "-m 'not live'"